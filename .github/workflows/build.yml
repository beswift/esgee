name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Windows app
        run: dotnet build src/Esgee/Esgee.csproj -c Release

      - name: Build headless node
        run: dotnet build src/Esgee.Node/Esgee.Node.csproj -c Release
